<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catalog — GovData MCP</title>
<meta name="description" content="Every data source available through the GovData MCP gateway: agency, category, access (keyless or bring-your-own-key), status, upstream API, and an example native query." />
<style>
  :root{
    --bg:#0a0c10; --panel:#11151c; --panel2:#161b24; --line:#222a36;
    --text:#e6edf3; --muted:#8b97a7; --dim:#5c6776;
    --accent:#5ee6a8; --accent2:#6aa3ff; --warn:#ffb454; --red:#ff6b6b;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--accent2);text-decoration:none}
  a:hover{text-decoration:underline}
  code,pre{font-family:var(--mono)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  nav{position:sticky;top:0;z-index:10;backdrop-filter:blur(10px);background:rgba(10,12,16,.78);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
  .brand{font-family:var(--mono);font-weight:600;letter-spacing:-.02em;color:var(--text);font-size:15px}
  .brand .dot{color:var(--accent)}
  .navlinks a{color:var(--muted);font-size:14px;margin-left:22px}
  .navlinks a:hover{color:var(--text);text-decoration:none}

  header.head{padding:48px 0 24px}
  h1{font-size:clamp(28px,5vw,38px);letter-spacing:-.03em;margin:0 0 10px}
  .sub{color:var(--muted);margin:0;font-size:16px}
  .sub b{color:var(--accent);font-weight:600}

  /* controls */
  .controls{position:sticky;top:58px;z-index:9;background:var(--bg);padding:18px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 13px}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14.5px;font-family:var(--sans)}
  .search svg{flex:none;opacity:.5}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{background:none;border:none;color:var(--muted);font-size:13px;padding:9px 13px;cursor:pointer;font-family:var(--sans);border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--panel2);color:var(--text)}
  .seg button:hover{color:var(--text)}

  .meta-row{padding:14px 0 4px;color:var(--dim);font-size:13px;font-family:var(--mono)}

  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));padding:8px 0 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 18px 16px;display:flex;flex-direction:column;transition:.15s}
  .card:hover{border-color:var(--dim)}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card h3{font-size:16.5px;margin:0;letter-spacing:-.01em}
  .agency{color:var(--dim);font-size:12.5px;margin:3px 0 0;font-family:var(--mono)}
  .badges{display:flex;gap:6px;flex-wrap:wrap;flex:none}
  .badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
  .b-keyless{color:var(--accent);border-color:rgba(94,230,168,.35);background:rgba(94,230,168,.07)}
  .b-byok{color:var(--warn);border-color:rgba(255,180,84,.35);background:rgba(255,180,84,.07)}
  .b-live{color:var(--accent)}
  .b-planned{color:var(--muted)}
  .b-testing{color:var(--accent2)}
  .b-degraded{color:var(--red)}
  .b-retired{color:var(--dim)}
  .st-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .summary{color:var(--muted);font-size:14px;margin:13px 0 0}
  .cat{display:inline-block;margin-top:12px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
  .urls{margin-top:13px;padding-top:13px;border-top:1px solid var(--line);font-size:12.5px;font-family:var(--mono);display:flex;flex-direction:column;gap:5px}
  .urls .row{display:flex;gap:8px;color:var(--dim)}
  .urls .row span{flex:none;color:var(--dim)}
  .urls .row a,.urls .row code{color:var(--muted);word-break:break-all}
  .urls .row a:hover{color:var(--accent2)}
  details.ex{margin-top:13px}
  details.ex summary{cursor:pointer;font-size:12.5px;font-family:var(--mono);color:var(--accent2);list-style:none}
  details.ex summary::-webkit-details-marker{display:none}
  details.ex summary::before{content:"▸ ";color:var(--dim)}
  details.ex[open] summary::before{content:"▾ "}
  .ex .intent{color:var(--muted);font-size:13px;margin:9px 0 6px}
  .ex pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin:0;font-size:12px;color:var(--text);overflow:auto;white-space:pre;line-height:1.5}
  .ex .qi{margin-bottom:10px}
  .ex .qi:last-child{margin-bottom:0}

  .empty{padding:60px 0;text-align:center;color:var(--dim);font-family:var(--mono);font-size:14px}

  .soon{padding:40px 0 18px;border-top:1px solid var(--line);margin-top:18px}
  .soon h2{font-size:13px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 14px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px}

  footer{padding:40px 0;color:var(--dim);font-size:13px;border-top:1px solid var(--line)}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
  footer a{color:var(--muted)}
  @media(max-width:560px){.controls{top:58px}}
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a class="brand" href="/" style="text-decoration:none">govdata<span class="dot">·</span>mcp</a>
    <span class="navlinks">
      <a href="/">Home</a>
      <a href="/api/catalog">API</a>
      <a href="https://github.com/zkiihne/govdata-mcp">GitHub ↗</a>
    </span>
  </div>
</nav>

<header class="head">
  <div class="wrap">
    <h1>Data catalog</h1>
    <p class="sub" id="sub">Loading sources from <code>/api/catalog</code>…</p>
  </div>
</header>

<div class="controls">
  <div class="wrap" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;width:100%;margin:0 auto">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Search name, agency, category…" autocomplete="off" />
    </label>
    <div class="seg" id="keySeg">
      <button data-key="all" class="on">All access</button>
      <button data-key="keyless">Keyless</button>
      <button data-key="byok">BYOK</button>
    </div>
    <div class="seg" id="statusSeg">
      <button data-status="all" class="on">All status</button>
      <button data-status="live">Live</button>
      <button data-status="planned">Planned</button>
      <button data-status="testing">Testing</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="meta-row" id="meta"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No sources match those filters.</div>

  <div class="soon">
    <h2>Coming soon — vetting backlog</h2>
    <div class="chips" id="soon"></div>
  </div>
</div>

<footer>
  <div class="wrap">
    <span>Rendered live from <code>/api/catalog</code> — always in sync with the gateway.</span>
    <span><a href="/">Home</a> · <a href="https://github.com/zkiihne/govdata-mcp">GitHub</a></span>
  </div>
</footer>

<script>
const SOON = ["cdc-open-data","congress-gov","data-gov","dol","eia","fcc",
  "federal-register","govinfo","nasa","nhtsa","openfda",
  "treasury-fiscal-data","usgs-earthquake","usgs-water"];

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = { key:"all", status:"all", q:"" };
let SOURCES = [];

function badgeStatus(s){
  const colors={live:"var(--accent)",planned:"var(--muted)",testing:"var(--accent2)",degraded:"var(--red)",retired:"var(--dim)"};
  const c=colors[s]||"var(--muted)";
  return `<span class="badge b-${esc(s)}"><span class="st-dot" style="background:${c}"></span>${esc(s)}</span>`;
}

function exampleHtml(qs){
  if(!Array.isArray(qs)||!qs.length) return "";
  const inner = qs.map(q=>{
    let payload;
    try{ payload = JSON.stringify(q.request,null,2); }catch(e){ payload = String(q.request); }
    return `<div class="qi"><div class="intent">${esc(q.intent)}</div><pre>${esc(payload)}</pre></div>`;
  }).join("");
  return `<details class="ex"><summary>Example quer${qs.length>1?"ies":"y"}</summary><div style="margin-top:8px">${inner}</div></details>`;
}

function card(s){
  const byok = !!(s.auth && s.auth.requiresKey);
  const keyCls = byok?"b-byok":"b-keyless";
  const keyLabel = byok?"byok":"keyless";
  const docs = s.api && s.api.docsUrl ? `<div class="row"><span>docs</span><a href="${esc(s.api.docsUrl)}" target="_blank" rel="noopener">${esc(s.api.docsUrl)}</a></div>` : "";
  const base = s.api && s.api.baseUrl ? `<div class="row"><span>api&nbsp;</span><code>${esc(s.api.baseUrl)}</code></div>` : "";
  const key = byok ? `<div class="row"><span>key&nbsp;</span><code>${esc(s.auth.envVar||"")}</code>${s.auth.signupUrl?` · <a href="${esc(s.auth.signupUrl)}" target="_blank" rel="noopener">get a free key ↗</a>`:""}</div>` : "";
  return `<div class="card">
    <div class="top">
      <div>
        <h3>${esc(s.name)}</h3>
        <p class="agency">${esc(s.agency)}</p>
      </div>
      <div class="badges">
        <span class="badge ${keyCls}">${keyLabel}</span>
        ${badgeStatus(s.status)}
      </div>
    </div>
    <p class="summary">${esc(s.llmDocs && s.llmDocs.summary)}</p>
    <span class="cat">› ${esc(s.category)}</span>
    <div class="urls">${base}${docs}${key}</div>
    ${exampleHtml(s.llmDocs && s.llmDocs.exampleQueries)}
  </div>`;
}

function render(){
  const q = state.q.trim().toLowerCase();
  const list = SOURCES.filter(s=>{
    if(state.key!=="all"){
      const byok = !!(s.auth && s.auth.requiresKey);
      if(state.key==="byok" && !byok) return false;
      if(state.key==="keyless" && byok) return false;
    }
    if(state.status!=="all" && s.status!==state.status) return false;
    if(q){
      const hay = [s.name,s.agency,s.category,s.id,s.llmDocs&&s.llmDocs.summary].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const grid=document.getElementById('grid'), empty=document.getElementById('empty');
  grid.innerHTML = list.map(card).join("");
  empty.style.display = list.length?"none":"block";
  document.getElementById('meta').textContent =
    `Showing ${list.length} of ${SOURCES.length} source${SOURCES.length===1?"":"s"}`;
}

function wireSeg(id,key){
  document.getElementById(id).addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    state[key]=b.getAttribute('data-'+key);
    [...e.currentTarget.querySelectorAll('button')].forEach(x=>x.classList.toggle('on',x===b));
    render();
  });
}
wireSeg('keySeg','key');
wireSeg('statusSeg','status');
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;render();});

document.getElementById('soon').innerHTML =
  SOON.map(n=>`<span class="chip">${esc(n)}</span>`).join("");

fetch('/api/catalog').then(r=>{
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}).then(d=>{
  SOURCES = (d.sources||[]).slice().sort((a,b)=>{
    const order={live:0,testing:1,degraded:2,planned:3,retired:4};
    return (order[a.status]??9)-(order[b.status]??9) || a.name.localeCompare(b.name);
  });
  const live = SOURCES.filter(s=>s.status==="live").length;
  document.getElementById('sub').innerHTML =
    `<b>${d.count ?? SOURCES.length}</b> sources via one MCP endpoint · ${live} live now.`;
  render();
}).catch(err=>{
  document.getElementById('sub').textContent = 'Failed to load catalog: '+err.message;
  document.getElementById('meta').textContent = '';
});
</script>
</body>
</html>
